server.port=${SERVER_PORT:8080}
spring.application.name=${SPRING_APPLICATION_NAME:healthmate-backend}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/healthmate}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:healthmate}

# Default fallbacks keep local boot/tests simple; production profile should override these.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@healthmate.local}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
gemini.api.key=${GEMINI_API_KEY:}
jwt.secret=${JWT_SECRET:healthmateSecretKey123healthmateSecretKey123}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://615915.xyz}
